<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Truncation Checker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  width: 400px;
  font-family: 'Space Grotesk', Arial, sans-serif;
  background: #f8f9fa;
  color: #15121f;
  font-size: 13px;
}
.mono { font-family: 'JetBrains Mono', monospace; }

.header {
  background: white; padding: 12px 14px 10px;
  border-bottom: 3px solid #15121f;
  display: flex; align-items: center; gap: 10px;
}
.header-mark { width: 30px; height: 26px; position: relative; flex: 0 0 auto; }
.header-mark .body { position: absolute; inset: 0; background: #fff; border: 3px solid #15121f; border-radius: 6px; }
.header-mark .flap { position: absolute; top: 0; left: 0; width: 100%; height: 60%; clip-path: polygon(0 0, 100% 0, 50% 100%); background: linear-gradient(90deg, #00E5FF 50%, #FFE347 50%); border-top: 3px solid #15121f; border-radius: 6px 6px 0 0; }
.header-mark .check { position: absolute; right: -5px; bottom: -5px; width: 15px; height: 15px; border-radius: 50%; background: #2ECC71; border: 2.5px solid #15121f; display: flex; align-items: center; justify-content: center; }
.header-mark .check span { color: #fff; font-size: 9px; font-weight: 700; line-height: 1; }
.header-title { font-size: 15px; font-weight: 700; letter-spacing: -0.01em; }
.header-sub { font-size: 10px; color: #6b5b8a; margin-top: 1px; text-transform: uppercase; letter-spacing: .05em; font-family: 'JetBrains Mono', monospace; font-weight: 700; }

.inputs {
  background: white; border-bottom: 3px solid #15121f;
  padding: 12px 14px 14px;
}
.sender-row { margin-bottom: 10px; }
.field-label { font-size: 10px; color: #6b5b8a; margin-bottom: 4px; display: flex; justify-content: space-between; text-transform: uppercase; letter-spacing: .04em; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
.char-pill { font-weight: 700; color: #15121f; background: #FFE347; border: 1.5px solid #15121f; border-radius: 4px; padding: 0 5px; }
.sender-input {
  width: 100%; border: 2px solid #15121f; border-radius: 8px;
  padding: 6px 9px; font-size: 12px; font-family: inherit;
  height: 30px; outline: none; color: #15121f;
}
.sender-input:focus { border-color: #FF3FA4; box-shadow: 2px 2px 0 #15121f; }
.text-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
textarea {
  width: 100%; border: 2px solid #15121f; border-radius: 8px;
  padding: 6px 9px; font-size: 12px; font-family: inherit;
  resize: none; height: 52px; outline: none; color: #15121f; line-height: 1.4;
}
textarea:focus { border-color: #FF3FA4; box-shadow: 2px 2px 0 #15121f; }
textarea::placeholder { color: #c2b8d6; }
.paste-hint { font-size: 10px; color: #6b5b8a; margin-top: 7px; font-family: 'JetBrains Mono', monospace; display: flex; align-items: center; gap: 6px; }
.paste-hint::before { content: ''; width: 6px; height: 6px; background: #00E5FF; border: 1.5px solid #15121f; border-radius: 50%; flex: 0 0 auto; }
.paste-hint.selected { color: #178a4c; font-weight: 700; }
.paste-hint.selected::before { background: #2ECC71; }

/* RESULTS */
.results-list { padding: 12px 12px 14px; display: flex; flex-direction: column; gap: 8px; }

.client-card {
  background: white; border: 2px solid #15121f; border-radius: 10px;
  overflow: hidden;
}
.client-card-header {
  padding: 8px 12px 6px;
  border-bottom: 2px solid #15121f;
  display: flex; align-items: center; gap: 6px;
}
.client-card-name { font-size: 12px; font-weight: 700; color: #15121f; }
.device-badge { font-size: 9px; padding: 2px 7px; border-radius: 999px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; font-family: 'JetBrains Mono', monospace; border: 1.5px solid #15121f; }
.device-mobile { background: #00E5FF; color: #15121f; }
.device-desktop { background: #FFE347; color: #15121f; }

/* Inbox mock inside card */
.inbox-mock {
  padding: 7px 12px 6px;
  border-bottom: 2px solid #f0f2f5;
}
.mock-sender { font-size: 12px; font-weight: 700; color: #202124; margin-bottom: 2px; }
.mock-line { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mock-subject { font-weight: 500; color: #202124; }
.mock-sep { color: #9aa0a6; }
.mock-prev { color: #5f6368; }
.mock-cut { color: #FB5124; font-weight: 700; }
.mock-subject-line { font-weight: 500; color: #202124; }
.mock-preview-line { color: #5f6368; }

/* Status rows */
.status-rows { padding: 7px 12px 9px; display: flex; flex-direction: column; gap: 5px; }
.status-row { display: flex; align-items: center; justify-content: space-between; }
.status-field { font-size: 11px; color: #6b5b8a; font-family: 'JetBrains Mono', monospace; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; }
.status-badge {
  font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 999px;
  border: 1.5px solid #15121f; font-family: 'JetBrains Mono', monospace;
}
.badge-green { background: #2ECC71; color: #fff; }
.badge-orange { background: #FFE347; color: #15121f; }
.badge-red { background: #FB5124; color: #fff; }

.empty-state { text-align: center; padding: 26px 20px; color: #6b5b8a; font-size: 12px; }
.empty-state .em { display: block; margin: 0 auto 10px; width: 34px; height: 28px; position: relative; }
.empty-state .em .body { position: absolute; inset: 0; background: #fff; border: 3px solid #c2b8d6; border-radius: 6px; }
.empty-state .em .flap { position: absolute; top: 0; left: 0; width: 100%; height: 60%; clip-path: polygon(0 0, 100% 0, 50% 100%); border-top: 3px solid #c2b8d6; border-radius: 6px 6px 0 0; }

.footer {
  background: white; border-top: 3px solid #15121f;
  padding: 9px 14px; display: flex; align-items: center; justify-content: space-between;
}
.footer-name { font-size: 11px; color: #6b5b8a; }
.footer-name a { color: #FF3FA4; text-decoration: none; font-weight: 700; }
.footer-name a:hover { text-decoration: underline; }
.footer-sge a { font-size: 10px; color: #6b5b8a; text-decoration: none; font-family: 'JetBrains Mono', monospace; }
.footer-sge a:hover { color: #FF3FA4; }
</style>
</head>
<body>

<div class="header">
  <div class="header-mark">
    <div class="body"></div>
    <div class="flap"></div>
    <div class="check"><span>✓</span></div>
  </div>
  <div>
    <div class="header-title">Subject Line Checker</div>
  </div>
</div>

<div class="inputs">
  <div class="sender-row">
    <div class="field-label"><span>Sender name</span></div>
    <input type="text" class="sender-input" id="sender-input" placeholder="e.g. Metricool" value="Your Brand">
  </div>
  <div class="text-row">
    <div>
      <div class="field-label"><span>Subject line</span><span class="char-pill" id="cc-s">0</span></div>
      <textarea id="inp-subject" placeholder="Your subject line…"></textarea>
    </div>
    <div>
      <div class="field-label"><span>Preview text</span><span class="char-pill" id="cc-p">0</span></div>
      <textarea id="inp-preview" placeholder="Your preview text…"></textarea>
    </div>
  </div>
  <div class="paste-hint" id="paste-hint">Select text on any page before opening to auto-fill</div>
</div>

<div class="results-list" id="results-list">
  <div class="empty-state"><span class="em"><span class="body"></span><span class="flap"></span></span>Fill in the fields above to check truncation</div>
</div>

<script src="popup.js"></script>

<div class="footer">
  <span class="footer-name">by <a href="https://david.sendgoodemails.com" target="_blank">David Bustos</a></span>
  <span class="footer-sge"><a href="https://www.sendgoodemails.com" target="_blank">sendgoodemails.com</a></span>
</div>
</body>
</html>
